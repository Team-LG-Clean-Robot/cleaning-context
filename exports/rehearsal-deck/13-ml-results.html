<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ML 학습 결과</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --chart-1: #333333; --chart-2: #888888;
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 36px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 22px; }
.layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px; width: 100%; max-width: 1040px; align-items: center; }
.chart-wrapper { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 16px; padding: 24px; }
.chart-wrapper canvas { max-height: 320px; }
.kpis { display: flex; flex-direction: column; gap: 14px; }
.kpi { background: var(--accent-soft); border: 1px solid var(--border-card); border-radius: 14px; padding: 18px 22px; }
.kpi .big { font-size: 32px; font-weight: 900; }
.kpi .lab { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.src { font-size: 11px; color: var(--text-muted); margin-top: 14px; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">학습 결과 — 위치 추정</h1>
  <div class="deck-meta">ML · 박주상 · CASAS hh106 공개 데이터셋 · RandomForest</div>
  <div class="layout">
    <div class="chart-wrapper"><canvas id="accChart"></canvas></div>
    <div class="kpis">
      <div class="kpi"><div class="big">98.9%</div><div class="lab">Holdout 정확도</div></div>
      <div class="kpi"><div class="big">99.0%</div><div class="lab">5-fold 교차검증</div></div>
      <div class="kpi"><div class="big">KPI ✅</div><div class="lab">목표 ≥75% / CV ≥70% 충족</div></div>
    </div>
  </div>
  <div class="src">단일 거주자 위치라 정확도가 본질적으로 높음 — ML 실효 가치는 confidence 보정 + 이질 센서 융합 (CLEANING_DECISION_ALGORITHM.md §1)</div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="12-ml-role.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">13 / 16</a></div>
    <div class="nav-right"><a href="14-ml-ambient.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('14-ml-ambient.html');
  if (e.key === 'ArrowLeft') navigateTo('12-ml-role.html');
});
const css = getComputedStyle(document.documentElement); const v = (n) => css.getPropertyValue(n).trim();
const TEXT = v('--text-secondary'), GRID = v('--border-card'), FONT = v('--font-main');
new Chart(document.getElementById('accChart').getContext('2d'), {
  type: 'bar',
  data: { labels: ['현관','거실','주방','침실','욕실','외출'], datasets: [{ label: '클래스별 정확도(%) · 예시', data: [99,98,99,99,97,100], backgroundColor: v('--chart-2'), borderColor: v('--chart-1'), borderWidth: 1 }] },
  options: { responsive: true, plugins: { legend: { labels: { color: TEXT, font: { family: FONT } } } }, scales: { x: { ticks: { color: TEXT }, grid: { color: GRID } }, y: { min: 0, max: 100, ticks: { color: TEXT }, grid: { color: GRID } } } }
});
</script>
</body>
</html>
