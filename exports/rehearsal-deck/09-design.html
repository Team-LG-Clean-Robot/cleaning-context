<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>알고리즘 설계 개괄</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 34px 70px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 22px; }
.axes { display: flex; gap: 18px; margin-bottom: 22px; }
.axis { background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 14px; padding: 13px 26px; text-align: center; min-width: 330px; }
.axis .t { font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
.axis .d { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
.anum { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-gradient); color: #fff; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }

/* EDGE | CLOUD 존 그룹 */
.flow { display: flex; align-items: stretch; width: 100%; max-width: 1140px; gap: 0; }
.zone { border-radius: 14px; padding: 12px 14px 14px; }
.zone-head { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.zone-edge { background: var(--accent-soft); border: 1.5px solid var(--accent-border); flex: 0 0 auto; }
.zone-edge .zone-head { color: var(--accent-start); }
.zone-cloud { background: var(--bg-card); border: 1px solid var(--border-card); flex: 1; }
.zone-cloud .zone-head { color: var(--text-muted); justify-content: flex-start; }
.layers { display: flex; align-items: stretch; }
.layer { background: var(--surface-raised); border: 1px solid var(--border-card); border-radius: 10px; padding: 12px 10px; text-align: center; min-width: 132px; flex: 1; display: flex; flex-direction: column; }
.zone-edge .layer { border-color: var(--accent-border); }
.layer .lt { font-size: 14.5px; font-weight: 800; }
.layer .ld { font-size: 11px; color: var(--text-sub); margin-top: 5px; line-height: 1.45; }
.arrow { display: flex; align-items: center; padding: 0 6px; color: var(--accent-start); font-size: 16px; font-weight: 800; }

/* CSS 아이콘 · 칩(EDGE) / 클라우드(CLOUD) */
.ico-chip { width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 3px; position: relative; display: inline-block; flex: 0 0 auto; }
.ico-chip::after { content: ''; position: absolute; inset: 3px; background: currentColor; border-radius: 1px; opacity: 0.3; }
.ico-cloud { position: relative; width: 22px; height: 14px; display: inline-block; color: var(--text-muted); flex: 0 0 auto; }
.ico-cloud i { position: absolute; background: currentColor; display: block; }
.ico-cloud .base { bottom: 0; left: 0; width: 22px; height: 7px; border-radius: 4px; }
.ico-cloud .b1 { bottom: 3px; left: 3px; width: 9px; height: 9px; border-radius: 50%; }
.ico-cloud .b2 { bottom: 4px; left: 9px; width: 11px; height: 11px; border-radius: 50%; }

/* 엣지 경계 · CSS 자물쇠 디바이더 */
.boundary { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 6px; }
.boundary .line { width: 0; flex: 1; border-left: 2px dashed var(--accent-border); }
.ico-lock { position: relative; width: 16px; height: 15px; margin: 7px 0; }
.ico-lock .body { position: absolute; bottom: 0; left: 0; width: 16px; height: 9px; background: var(--accent-start); border-radius: 2px; }
.ico-lock .shackle { position: absolute; top: 0; left: 3.5px; width: 9px; height: 8px; border: 2px solid var(--accent-start); border-bottom: none; border-radius: 5px 5px 0 0; }
.boundary .blab { font-size: 9.5px; font-weight: 800; color: var(--accent-start); writing-mode: vertical-rl; letter-spacing: 0.1em; }

.bridge { margin-top: 16px; width: 100%; max-width: 1140px; background: var(--accent-gradient); color: #fff; border-radius: 12px; padding: 13px 24px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px; }
.bridge b { font-weight: 800; }
.ico-play { width: 0; height: 0; border-left: 11px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; display: inline-block; flex: 0 0 auto; }

.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">어떻게 동작하나</h1>
  <div class="deck-meta">두 축 + 데이터 흐름</div>
  <div class="axes">
    <div class="axis"><div class="t"><span class="anum">1</span>맥락 인식</div><div class="d">센서로 '지금 무슨 상황인지' 읽고 청소 우선순위 결정</div></div>
    <div class="axis"><div class="t"><span class="anum">2</span>Privacy-on-Edge</div><div class="d">민감 정보는 로컬에만</div></div>
  </div>
  <div class="flow">
    <div class="zone zone-edge">
      <div class="zone-head"><span class="ico-chip"></span>EDGE · 디바이스 안</div>
      <div class="layers">
        <div class="layer"><div class="lt">센서</div><div class="ld">도어락·인덕션·냉장고 등 센서 12종</div></div>
        <div class="arrow">→</div>
        <div class="layer"><div class="lt">추론</div><div class="ld">ML=사용자 위치<br>규칙=맥락 판별</div></div>
      </div>
    </div>
    <div class="boundary">
      <div class="line"></div>
      <div class="ico-lock"><span class="body"></span><span class="shackle"></span></div>
      <div class="blab">엣지 경계</div>
      <div class="line"></div>
    </div>
    <div class="zone zone-cloud">
      <div class="zone-head"><span class="ico-cloud"><i class="base"></i><i class="b1"></i><i class="b2"></i></span>CLOUD · 결과만 올라감</div>
      <div class="layers">
        <div class="layer"><div class="lt">이벤트</div><div class="ld">귀가함<br>요리 끝남 …</div></div>
        <div class="arrow">→</div>
        <div class="layer"><div class="lt">점수 계산</div><div class="ld">규칙대로<br>방별 점수</div></div>
        <div class="arrow">→</div>
        <div class="layer"><div class="lt">AI 설명</div><div class="ld">점수표<br>→ 말로 된 설명</div></div>
      </div>
    </div>
  </div>
  <div class="bridge"><span class="ico-play"></span><span>다음 화면(라이브)에서 이 흐름 전체가 <b>실제로 도는 것</b>을 보여드립니다.</span></div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="08-finance-pnl.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">09 / 16</a></div>
    <div class="nav-right"><a href="10-live-demo.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('10-live-demo.html');
  if (e.key === 'ArrowLeft') navigateTo('08-finance-pnl.html');
});
</script>
</body>
</html>
