<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>수익 모델</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 40px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 44px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 30px; }
.streams { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; width: 100%; max-width: 920px; }
.stream { border-radius: 18px; padding: 30px 28px; text-align: center; }
.stream.hw { background: var(--bg-card); border: 1px solid var(--border-card); }
.stream.sub { background: var(--accent-soft); border: 1px solid var(--accent-border); }
.stream .k { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; }
.stream .price { font-size: 36px; font-weight: 900; margin: 8px 0; font-variant-numeric: tabular-nums; }
.stream .h { font-size: 17px; font-weight: 800; }
.stream .d { font-size: 14px; color: var(--text-sub); margin-top: 8px; line-height: 1.55; }
.note { margin-top: 22px; font-size: 14px; color: var(--text-secondary); text-align: center; }
.note b { color: var(--accent-start); }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">수익 모델 — 디바이스 + 구독</h1>
  <div class="deck-meta">사업성 · 김준성</div>
  <div class="streams">
    <div class="stream hw">
      <div class="k">1회성 · 하드웨어</div>
      <div class="price">₩699,000</div>
      <div class="h">로봇청소기 본체</div>
      <div class="d">맥락 인식 + Privacy-on-Edge 탑재 프리미엄 디바이스</div>
    </div>
    <div class="stream sub">
      <div class="k">반복 · 구독</div>
      <div class="price">₩4,900<span style="font-size:16px">/월</span></div>
      <div class="h">Lumos Pro</div>
      <div class="d">IoT 멀티 기기 연동 · 고급 맥락 시나리오 · 자동 추론(ML) 모드</div>
    </div>
  </div>
  <div class="note">하드웨어로 진입, <b>구독으로 LTV 확보</b> — H/W 가격경쟁이 아닌 SW 레이어로 차별화</div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="05-market-2.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">06 / 16</a></div>
    <div class="nav-right"><a href="07-finance-unit.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('07-finance-unit.html');
  if (e.key === 'ArrowLeft') navigateTo('05-market-2.html');
});
</script>
</body>
</html>
