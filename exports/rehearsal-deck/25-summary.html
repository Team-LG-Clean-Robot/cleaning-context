<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>종합 정리</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 34px 70px; display: flex; flex-direction: column; align-items: center; }
.eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.2em; color: var(--text-secondary); margin-bottom: 8px; }
.eyebrow .lg { color: var(--text-primary); }
.title { font-size: 44px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.2; }
.subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 26px; }

.answers { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.item { display: flex; align-items: center; gap: 20px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 14px; padding: 16px 24px; }
.item .no { font-size: 24px; font-weight: 900; color: var(--accent-start); min-width: 40px; }
.item .body { flex: 1; }
.item .q { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
.item .q::before { content: 'Q. '; color: var(--accent-start); font-weight: 800; }
.item .h { font-size: 18px; font-weight: 800; }
.item .d { font-size: 13.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.45; }
.item .metric { width: 58px; height: 58px; border-radius: 14px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

/* 01 무엇을·왜 — 집 */
.ic-home { width: 30px; height: 27px; position: relative; }
.ic-home .roof { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 13px solid #fff; }
.ic-home .base { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 15px; background: #fff; border-radius: 0 0 3px 3px; }

/* 02 돈이 되는가 — ₩ 동전 */
.ic-coin { width: 30px; height: 30px; border: 2.5px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ic-coin::before { content: '₩'; color: #fff; font-size: 17px; font-weight: 900; line-height: 1; }

/* 03 어떻게 작동하나 — 4단계 파이프라인 */
.ic-flow { display: flex; align-items: center; }
.ic-flow .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; flex: 0 0 auto; }
.ic-flow .ln { width: 6px; height: 2px; background: rgba(255, 255, 255, 0.6); flex: 0 0 auto; }

/* 04 더 똑똑해지나 — 뉴럴넷 */
.ic-net { width: 30px; height: 26px; position: relative; }
.ic-net .e { position: absolute; height: 2px; background: rgba(255, 255, 255, 0.55); transform-origin: left center; }
.ic-net .e1 { left: 4px; top: 4px; width: 24px; transform: rotate(21deg); }
.ic-net .e2 { left: 4px; bottom: 4px; width: 24px; transform: rotate(-21deg); }
.ic-net .node { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.ic-net .n1 { left: 0; top: 0; }
.ic-net .n2 { left: 0; bottom: 0; }
.ic-net .n3 { right: 0; top: 50%; transform: translateY(-50%); }

.closing { width: 100%; max-width: 1000px; background: var(--accent-gradient); color: #fff; border-radius: 12px; padding: 16px 26px; font-size: 19px; font-weight: 600; text-align: center; }
.closing b { font-weight: 900; }

.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow"><span class="lg">LG</span> · Lumos</div>
  <h1 class="title">핵심 정리</h1>
  <p class="subtitle">목차에서 던진 4가지 질문에 대한 답</p>
  <div class="answers">
    <div class="item">
      <div class="no">01</div>
      <div class="body">
        <div class="q">무엇을, 왜 만들었나</div>
        <div class="h">집의 맥락을 읽는 로봇청소기의 두뇌</div>
        <div class="d">시키기 전 '지금 어디부터·왜'를 스스로 판단</div>
      </div>
      <div class="metric"><span class="ic-home"><span class="roof"></span><span class="base"></span></span></div>
    </div>
    <div class="item">
      <div class="no">02</div>
      <div class="body">
        <div class="q">돈이 되는가</div>
        <div class="h">디바이스 + 구독</div>
        <div class="d">핵심 SAM 13만 가구 · SW 레이어로 차별화</div>
      </div>
      <div class="metric"><span class="ic-coin"></span></div>
    </div>
    <div class="item">
      <div class="no">03</div>
      <div class="body">
        <div class="q">어떻게 작동하나</div>
        <div class="h">센서 → 맥락 → 점수 → 설명, 4단계</div>
        <div class="d">결정론적 점수 계산, LLM은 설명</div>
      </div>
      <div class="metric"><span class="ic-flow"><span class="dot"></span><span class="ln"></span><span class="dot"></span><span class="ln"></span><span class="dot"></span><span class="ln"></span><span class="dot"></span></span></div>
    </div>
    <div class="item">
      <div class="no">04</div>
      <div class="body">
        <div class="q">어떻게 더 똑똑해지나</div>
        <div class="h">센서만으로 사용자 위치를 추정하는 ML</div>
        <div class="d">강한 신호가 없는 시간대를 보완</div>
      </div>
      <div class="metric"><span class="ic-net"><i class="e e1"></i><i class="e e2"></i><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i></span></div>
    </div>
  </div>
  <div class="closing"><b>Lumos</b>, 맥락을 읽는 로봇청소기</div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="24-sim.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">25 / 27</a></div>
    <div class="nav-right"><a href="26-team.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('26-team.html');
  if (e.key === 'ArrowLeft') navigateTo('24-sim.html');
});
</script>
</body>
</html>
