<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>왜 ML (ambient)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 40px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 26px; }
.comparison { width: 100%; max-width: 1000px; }
.comparison-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; margin-bottom: 12px; }
.comp-head { font-size: 14px; font-weight: 800; color: var(--accent-start); letter-spacing: 0.05em; }
.comp-old { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 13px 18px; font-size: 15px; color: var(--text-secondary); }
.comp-arrow { font-size: 16px; color: var(--text-muted); }
.comp-new { background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 12px; padding: 13px 18px; font-size: 15px; color: var(--text-primary); font-weight: 600; }
.kicker { margin-top: 18px; font-size: 15px; color: var(--text-sub); text-align: center; max-width: 900px; }
.kicker b { color: var(--accent-start); }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">왜 ML인가 — 18시간을 메운다</h1>
  <div class="deck-meta">ML · 박주상</div>
  <div class="comparison">
    <div class="comparison-row">
      <div class="comp-head">룰로 충분 (강한 신호)</div><div></div><div class="comp-head" style="text-align:right;">ML 필요 (ambient)</div>
    </div>
    <div class="comparison-row">
      <div class="comp-old">요리 중 — 인덕션 ON</div><div class="comp-arrow">vs</div>
      <div class="comp-new">저녁 식사 후 · 가전 OFF · TV 꺼짐 — 어디?</div>
    </div>
    <div class="comparison-row">
      <div class="comp-old">취침 직전 — 침대 점유</div><div class="comp-arrow">vs</div>
      <div class="comp-new">평일 오후 · 모션만 간헐적 — 위치 모호</div>
    </div>
    <div class="comparison-row">
      <div class="comp-old">귀가 — 도어락 + 모션</div><div class="comp-arrow">vs</div>
      <div class="comp-new">거실↔주방 왕복 — 옮긴 건가 스친 건가</div>
    </div>
  </div>
  <div class="kicker">하루 중 강한 신호는 길어야 4~6시간. <b>나머지 18시간 ambient를 ML이 매 분 위치 추정으로 메운다.</b> ML은 룰을 대체하지 않고 보완한다.</div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="13-ml-results.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">14 / 16</a></div>
    <div class="nav-right"><a href="15-ml-reliability.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('15-ml-reliability.html');
  if (e.key === 'ArrowLeft') navigateTo('13-ml-results.html');
});
</script>
</body>
</html>
