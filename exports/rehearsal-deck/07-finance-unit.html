<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>시장·단위경제</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 40px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 44px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 26px; }
.funnel { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
.fstep { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 14px 20px; text-align: center; }
.fstep .n { font-size: 22px; font-weight: 900; }
.fstep .l { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.fstep.final { background: var(--accent-soft); border-color: var(--accent-border); }
.farrow { color: var(--accent-start); font-size: 18px; font-weight: 800; }
.pots { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; max-width: 820px; }
.pot { background: var(--surface-raised); border: 1px solid var(--border-card); border-radius: 14px; padding: 22px 26px; text-align: center; }
.pot .big { font-size: 30px; font-weight: 900; }
.pot .l { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
.src { font-size: 11px; color: var(--text-muted); margin-top: 16px; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">타깃 시장 · 단위경제 (SAM)</h1>
  <div class="deck-meta">사업성 · 김준성</div>
  <div class="funnel">
    <div class="fstep"><div class="n">60만</div><div class="l">수도권 30대 맞벌이 가구</div></div>
    <div class="farrow">×22%</div>
    <div class="fstep final"><div class="n">13만 가구</div><div class="l">반려견 보유 — 핵심 페르소나</div></div>
  </div>
  <div class="pots">
    <div class="pot"><div class="big">~910억</div><div class="l">디바이스 매출 잠재 (13만 × ₩699,000)</div></div>
    <div class="pot"><div class="big">~230억<span style="font-size:15px">/년</span></div><div class="l">구독 매출 잠재 (가입률 30% 가정)</div></div>
  </div>
  <div class="src">확장 SAM(반려견 조건 완화): 60만 가구 → 최대 ~4,200억 디바이스 잠재 · 출처 BUSINESS_PLAN.md §4.2</div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="06-finance-model.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">07 / 16</a></div>
    <div class="nav-right"><a href="08-finance-pnl.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('08-finance-pnl.html');
  if (e.key === 'ArrowLeft') navigateTo('06-finance-model.html');
});
</script>
</body>
</html>
