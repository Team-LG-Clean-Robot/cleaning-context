<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>목차</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 44px 80px; display: flex; flex-direction: column; align-items: center; }
.eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.2em; color: var(--text-secondary); margin-bottom: 10px; }
.eyebrow .lg { color: var(--text-primary); }
.title { font-size: 46px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 40px; line-height: 1.3; }
.agenda { width: 100%; max-width: 880px; display: flex; flex-direction: column; }
.item { position: relative; display: flex; align-items: center; gap: 20px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 14px; padding: 20px 26px; }
.item + .item { margin-top: 22px; }
/* A. 카드 사이 여정 연결선 (번호 열에 정렬) */
.item:not(:last-child)::after { content: ""; position: absolute; left: 48px; bottom: -22px; width: 2px; height: 22px; transform: translateX(-50%); background: var(--border-card); }
.item .no { font-size: 26px; font-weight: 900; color: var(--accent-start); min-width: 44px; text-align: center; }
.item .body { flex: 1; }
.item .h { font-size: 19px; font-weight: 800; }
.item .d { font-size: 14px; color: var(--text-secondary); margin-top: 3px; }
.item .who { font-size: 13px; font-weight: 700; color: var(--text-muted); }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow"><span class="lg">LG</span> · Lumos</div>
  <h1 class="title">목차</h1>
  <div class="agenda">
    <div class="item"><div class="no">01</div><div class="body"><div class="h">무엇을, 왜 만들었나</div><div class="d">미래 로봇청소기의 '두뇌'- 어떤 서비스이고 어떤 문제를 푸는가</div></div><div class="who">조현서</div></div>
    <div class="item"><div class="no">02</div><div class="body"><div class="h">돈이 되는가</div><div class="d">시장 규모와 경쟁, 얼마를 써서 얼마를 버는 구조인가</div></div><div class="who">김준성</div></div>
    <div class="item"><div class="no">03</div><div class="body"><div class="h">어떻게 작동하나</div><div class="d">실제 작동하는 웹 데모로 보는 의사결정 과정</div></div><div class="who">전유성</div></div>
    <div class="item"><div class="no">04</div><div class="body"><div class="h">어떻게 더 똑똑해지나</div><div class="d">센서만으로 사용자 위치를 추정하는 머신러닝 한 계층</div></div><div class="who">박주상</div></div>
  </div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="01-title.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">2 / 27</a></div>
    <div class="nav-right"><a href="03-service-video.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('03-service-video.html');
  if (e.key === 'ArrowLeft') navigateTo('01-title.html');
});
</script>
</body>
</html>
