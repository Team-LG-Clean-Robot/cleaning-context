<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>팀 소개</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 34px 70px; display: flex; flex-direction: column; align-items: center; }
.eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.2em; color: var(--text-secondary); margin-bottom: 8px; }
.eyebrow .lg { color: var(--text-primary); }
.title { font-size: 44px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.2; }
.subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; width: 100%; max-width: 1000px; }
.member { display: flex; align-items: center; gap: 20px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 16px; padding: 22px 26px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.info { flex: 1; }
.name-row { display: flex; align-items: baseline; gap: 8px; }
.name { font-size: 22px; font-weight: 900; }
.lead-tag { font-size: 11px; font-weight: 800; color: var(--text-secondary); border: 1px solid var(--border-card); border-radius: 7px; padding: 1px 7px; }
.role { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-top: 3px; }
.contrib { font-size: 13px; color: var(--text-sub); margin-top: 7px; line-height: 1.5; }

/* 풀스택 — 터미널 >_ */
.ic-term { width: 32px; height: 25px; border: 2.5px solid #fff; border-radius: 6px; position: relative; }
.ic-term::before { content: ''; position: absolute; left: 6px; top: 6.5px; width: 6px; height: 6px; border-right: 2.5px solid #fff; border-bottom: 2.5px solid #fff; transform: rotate(-45deg); }
.ic-term::after { content: ''; position: absolute; left: 14px; bottom: 6px; width: 9px; height: 2.5px; background: #fff; border-radius: 2px; }

/* 사업·재무 — 막대 그래프 */
.ic-chart { width: 30px; height: 24px; position: relative; }
.ic-chart i { position: absolute; bottom: 0; width: 7px; background: #fff; border-radius: 2px 2px 0 0; }
.ic-chart i:nth-child(1) { left: 0; height: 12px; opacity: 0.55; }
.ic-chart i:nth-child(2) { left: 11px; height: 18px; opacity: 0.78; }
.ic-chart i:nth-child(3) { left: 22px; height: 24px; }

/* ML — 뉴럴넷 노드 */
.ic-net { width: 32px; height: 28px; position: relative; }
.ic-net .e { position: absolute; height: 2px; background: rgba(255, 255, 255, 0.55); transform-origin: left center; }
.ic-net .e1 { left: 4.5px; top: 4.5px; width: 26px; transform: rotate(21deg); }
.ic-net .e2 { left: 4.5px; bottom: 4.5px; width: 26px; transform: rotate(-21deg); }
.ic-net .node { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.ic-net .n1 { left: 0; top: 0; }
.ic-net .n2 { left: 0; bottom: 0; }
.ic-net .n3 { right: 0; top: 50%; transform: translateY(-50%); }

/* 영상·리서치 — 비디오 프레임 + 재생 */
.ic-video { width: 32px; height: 24px; border: 2.5px solid #fff; border-radius: 6px; position: relative; }
.ic-video::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-40%, -50%); width: 0; height: 0; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">럭키 금성</div>
  <h1 class="title">팀 소개</h1>
  <p class="subtitle">4인의 역할</p>
  <div class="grid">
    <div class="member">
      <div class="avatar"><span class="ic-term"></span></div>
      <div class="info">
        <div class="name-row"><span class="name">전유성</span><span class="lead-tag">팀장</span></div>
        <div class="role">잡무</div>
        <div class="contrib">시뮬레이터 · 백엔드 · 디자인</div>
      </div>
    </div>
    <div class="member">
      <div class="avatar"><span class="ic-chart"><i></i><i></i><i></i></span></div>
      <div class="info">
        <div class="name-row"><span class="name">김준성</span></div>
        <div class="role">사업 · 재무</div>
        <div class="contrib">사업계획 총괄 및 재무 분석</div>
      </div>
    </div>
    <div class="member">
      <div class="avatar"><span class="ic-net"><i class="e e1"></i><i class="e e2"></i><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i></span></div>
      <div class="info">
        <div class="name-row"><span class="name">박주상</span></div>
        <div class="role">머신러닝</div>
        <div class="contrib">사용자 위치 추정 분류기 · 의사결정 알고리즘 설계</div>
      </div>
    </div>
    <div class="member">
      <div class="avatar"><span class="ic-video"></span></div>
      <div class="info">
        <div class="name-row"><span class="name">조현서</span></div>
        <div class="role">영상 · 리서치</div>
        <div class="contrib">AI 소개·데모 영상 제작 · 외부 시장 리서치</div>
      </div>
    </div>
  </div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="25-summary.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">26 / 27</a></div>
    <div class="nav-right"><a href="27-qna.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('27-qna.html');
  if (e.key === 'ArrowLeft') navigateTo('25-summary.html');
});
</script>
</body>
</html>
