<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>실행 모드 결정</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 40px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 48px; }
.step-container { display: flex; align-items: flex-start; gap: 24px; width: 100%; max-width: 1040px; position: relative; }
.step-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
.step-number { width: 56px; height: 56px; background: var(--accent-start); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; margin-bottom: 24px; }
.step-card { background: var(--surface-raised); border: 1px solid var(--border-card); border-radius: 20px; padding: 24px; text-align: center; width: 100%; min-height: 200px; }
.step-card h3 { font-size: 19px; font-weight: 800; margin-bottom: 12px; }
.step-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
.step-card b { color: var(--accent-start); }
.connector { position: absolute; top: 28px; left: 10%; right: 10%; height: 2px; background: var(--border-card); z-index: 1; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">Step 2 · 점수 기반 실행 모드 결정</h1>
  <div class="deck-meta">ML · 박주상</div>
  <div class="step-container">
    <div class="connector"></div>
    <div class="step-item">
      <div class="step-number">1</div>
      <div class="step-card">
        <h3>Excluded</h3>
        <p>최종 점수 <b>0 미만</b>으로 이번 턴에서는 청소 대상에서 제외</p>
      </div>
    </div>
    <div class="step-item">
      <div class="step-number">2</div>
      <div class="step-card">
        <h3>Delayed</h3>
        <p>우선순위는 있지만 현재 점유 등으로 <b>잠시 지연</b></p>
      </div>
    </div>
    <div class="step-item">
      <div class="step-number">3</div>
      <div class="step-card">
        <h3>Quiet</h3>
        <p>청소는 가능하지만 <b>저소음 모드</b> 필요</p>
      </div>
    </div>
    <div class="step-item">
      <div class="step-number">4</div>
      <div class="step-card">
        <h3>Normal</h3>
        <p>제약 사항 없음. 점수 내림차순에 따라 청소 수행</p>
      </div>
    </div>
  </div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="22-event-deltas.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">23 / 27</a></div>
    <div class="nav-right"><a href="24-sim.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('24-sim.html');
  if (e.key === 'ArrowLeft') navigateTo('22-event-deltas.html');
});
</script>
</body>
</html>
