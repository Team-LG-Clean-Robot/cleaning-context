<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Lumos — 제목</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
  --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 44px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.brand { font-size: 18px; font-weight: 800; letter-spacing: 0.2em; color: var(--text-secondary); margin-bottom: 18px; }
.brand .lg { color: var(--text-primary); }
.title { font-size: 60px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.2; margin-bottom: 38px; }
.meta { font-size: 15px; color: var(--text-secondary); margin-bottom: 28px; }
.team { font-size: 17px; font-weight: 800; color: var(--text-primary); letter-spacing: 0.02em; }
.team .lead::after { content: "·팀장"; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-left: 1px; }
.team .sep { color: var(--text-secondary); font-weight: 400; margin: 0 10px; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-disabled { font-size: 14px; font-weight: 700; color: var(--nav-disabled); cursor: default; }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <div class="brand"><span class="lg">LG</span> · 팀 럭키 금성</div>
  <h1 class="title">Lumos<br>집의 맥락을 읽는 로봇청소기</h1>
  <p class="meta">LG 가전 멘토링 · 성균관대 RISE · 2026.05.30</p>
  <div class="team"><span class="lead">전유성</span><span class="sep">·</span>김준성<span class="sep">·</span>박주상<span class="sep">·</span>조현서</div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><span class="nav-disabled">← 이전</span></div>
    <div class="nav-center"><a href="index.html">01 / 16</a></div>
    <div class="nav-right"><a href="02-agenda.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) { if (e.key === 'ArrowRight') navigateTo('02-agenda.html'); });
</script>
</body>
</html>
