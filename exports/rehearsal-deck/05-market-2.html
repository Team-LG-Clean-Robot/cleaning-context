<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>시장조사 ② 경쟁 함정</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 40px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 28px; }
.share { width: 100%; max-width: 920px; }
.bar { display: flex; height: 56px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-card); }
.seg { display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; }
.seg.cn { background: var(--accent-start); }
.seg.kr { background: var(--text-muted); }
.seg.etc { background: var(--border-card); color: var(--text-secondary); }
.legend { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--text-secondary); justify-content: center; }
.detail { margin-top: 18px; font-size: 14px; color: var(--text-sub); text-align: center; }
.detail b { color: var(--text-primary); }
.insight { margin-top: 26px; background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 14px; padding: 22px 28px; max-width: 920px; text-align: center; font-size: 18px; font-weight: 700; }
.insight span { color: var(--text-secondary); font-weight: 500; font-size: 15px; display: block; margin-top: 6px; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">시장의 함정 — 중국 4사 70%</h1>
  <div class="deck-meta">서비스 · 시장 · 조현서</div>
  <div class="share">
    <div class="bar">
      <div class="seg cn" style="width:70%">중국 4사 70%+</div>
      <div class="seg kr" style="width:20%">삼성+LG 20%</div>
      <div class="seg etc" style="width:10%">기타</div>
    </div>
    <div class="legend">
      <span>로보락 45–50% · 드리미 12% · 에코백스·모바 10%</span>
    </div>
    <div class="detail">로보락 한국 매출 <b>2020년 291억 → 2024년 3,000억+</b> (4년간 약 10배)</div>
  </div>
  <div class="insight">
    H/W 가격경쟁은 한국 제조사도 이미 패배.
    <span>진입 가능한 축은 <b>SW · 구독 · 서비스 차별화</b> — Lumos의 맥락 인식 + Privacy-on-Edge</span>
  </div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="04-market-1.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">05 / 16</a></div>
    <div class="nav-right"><a href="06-finance-model.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('06-finance-model.html');
  if (e.key === 'ArrowLeft') navigateTo('04-market-1.html');
});
</script>
</body>
</html>
