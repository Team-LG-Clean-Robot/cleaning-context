<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>시나리오 시뮬레이션</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 32px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }
.content-layout { display: flex; gap: 32px; width: 100%; align-items: stretch; }
.chart-container { flex: 1.2; background: var(--surface-raised); border: 1px solid var(--border-card); border-radius: 20px; padding: 32px; height: 420px; }
.scenario-panel { flex: 0.8; display: flex; flex-direction: column; gap: 18px; }
.scenario-btn { background: var(--surface-raised); border: 1px solid var(--border-card); padding: 22px; border-radius: 16px; cursor: pointer; text-align: left; transition: all 0.2s; }
.scenario-btn:hover { border-color: var(--accent-start); }
.scenario-btn.active { background: var(--accent-start); color: #fff; border-color: var(--accent-start); }
.scenario-btn h4 { font-size: 18px; margin-bottom: 8px; }
.scenario-btn p { font-size: 13px; opacity: 0.8; line-height: 1.4; }
.explanation-card { margin-top: 24px; width: 100%; background: var(--bg-card); border-radius: 18px; padding: 22px; border: 1px solid var(--border-card); }
.explanation-card h5 { font-size: 14px; font-weight: 800; color: var(--accent-start); margin-bottom: 8px; }
.explanation-card p { font-size: 16px; font-weight: 600; line-height: 1.6; }
/* 이모지 대체 인라인 CSS 아이콘 (currentColor 상속) — 스피커 */
.ic { display: inline-block; position: relative; width: 0.95em; height: 0.95em; vertical-align: -0.12em; margin-right: 0.4em; }
.ic-speaker::before { content: ''; position: absolute; left: 0.02em; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 0.3em solid transparent; border-bottom: 0.3em solid transparent; border-left: 0.42em solid currentColor; }
.ic-speaker::after { content: ''; position: absolute; right: 0.04em; top: 50%; transform: translateY(-50%); width: 0.46em; height: 0.62em; border: 0.09em solid currentColor; border-left-color: transparent; border-top-color: transparent; border-bottom-color: transparent; border-radius: 50%; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">Step 3 · 시나리오 시뮬레이션</h1>
  <div class="deck-meta">ML · 박주상 · 튜닝값·멀티 룸 분산 반영 실측 검증</div>
  <div class="content-layout">
    <div class="chart-container">
      <canvas id="simChart"></canvas>
    </div>
    <div class="scenario-panel">
      <div class="scenario-btn active" onclick="updateScenario(0, this)">
        <h4>시나리오 1. 비 오는 날 귀가</h4>
        <p>현관(+40), 거실(+15, -20점유), 침실(-20취침)</p>
      </div>
      <div class="scenario-btn" onclick="updateScenario(1, this)">
        <h4>시나리오 2. 요리 직후</h4>
        <p>주방(+35), 거실(+5, -20점유)</p>
      </div>
    </div>
  </div>
  <div class="explanation-card">
    <h5><span class="ic ic-speaker"></span>시스템 생성 설명 (System Reasoning)</h5>
    <p id="expText">비 오는 날 귀가로 현관 오염 가능성이 가장 높아 현관을 우선 청소합니다. 거실은 사용자가 머무는 중이라 지연하고, 침실은 취침이 가까워 제외합니다.</p>
  </div>
</div>

<script>
const scenarios = [
  { scores: [62, 15, 28, -8, 18], text: "비 오는 날 귀가로 현관 오염 가능성이 가장 높아 현관을 우선 청소합니다. 거실은 사용자가 머무는 중이라 지연하고, 침실은 취침이 가까워 제외합니다." },
  { scores: [22, 5, 63, 12, 18], text: "요리 직후라 주방 오염 가능성이 가장 높아 주방을 우선 청소합니다. 거실은 사용자가 머물러 지연합니다." }
];
const ctx = document.getElementById('simChart').getContext('2d');
let chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['현관', '거실', '주방', '침실', '욕실'],
    datasets: [{
      label: 'Final Score',
      data: scenarios[0].scores,
      backgroundColor: scenarios[0].scores.map(v => v < 0 ? '#c62828' : '#333'),
      borderRadius: 8
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    scales: {
      y: { min: -20, max: 70, grid: { color: 'rgba(0,0,0,0.05)' } },
      x: { grid: { display: false } }
    },
    plugins: { legend: { display: false } }
  }
});
function updateScenario(idx, btn) {
  document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  chart.data.datasets[0].data = scenarios[idx].scores;
  chart.data.datasets[0].backgroundColor = scenarios[idx].scores.map(v => v < 0 ? '#c62828' : '#333');
  chart.update();
  document.getElementById('expText').innerText = scenarios[idx].text;
}
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('19-summary.html');
  if (e.key === 'ArrowLeft') navigateTo('17-mode.html');
});
</script>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="23-mode.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">24 / 27</a></div>
    <div class="nav-right"><a href="25-summary.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('25-summary.html');
  if (e.key === 'ArrowLeft') navigateTo('23-mode.html');
});
</script>
</body>
</html>
