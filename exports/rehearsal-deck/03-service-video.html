<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>서비스 소개 + 영상</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --shadow-accent: oklch(0.12 0 0 / 0.12);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 32px 80px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 42px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 6px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 6px; }
.tagline { font-size: 17px; color: var(--text-sub); text-align: center; margin-bottom: 22px; }
.tagline b { color: var(--text-primary); }
.video-frame { width: 100%; max-width: 920px; aspect-ratio: 16 / 9; border-radius: 16px; border: 1px dashed var(--border-card); background: var(--bg-card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 8px 32px var(--shadow-accent); }
.play { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-start); display: flex; align-items: center; justify-content: center; }
.play::after { content: ''; border-left: 24px solid #fff; border-top: 15px solid transparent; border-bottom: 15px solid transparent; margin-left: 6px; }
.video-note { font-size: 16px; font-weight: 600; color: var(--text-secondary); }
.deck-meta .ph { font-size:11px; font-weight:700; color: var(--text-muted); border:1px solid var(--border-card); border-radius:8px; padding:2px 8px; margin-left:6px; }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">무빙홈이란?</h1>
  <div class="deck-meta">서비스 · 시장 · 조현서 <span class="ph">영상 자리</span></div>
  <p class="tagline">IoT 멀티센서로 <b>생활 맥락</b>을 읽어, 로봇청소기가 <b>지금 어디부터 청소할지</b> 스스로 정한다.</p>
  <div class="video-frame">
    <div class="play"></div>
    <div class="video-note">AI 마케팅 영상 (발표 시 재생)</div>
  </div>
</div>
<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="02-agenda.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">03 / 16</a></div>
    <div class="nav-right"><a href="04-market-1.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('04-market-1.html');
  if (e.key === 'ArrowLeft') navigateTo('02-agenda.html');
});
</script>
</body>
</html>
