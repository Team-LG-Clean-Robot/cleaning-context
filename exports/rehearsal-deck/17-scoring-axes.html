<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>결정의 이유</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 30px 70px; display: flex; flex-direction: column; align-items: center; }
.title { font-size: 40px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 5px; line-height: 1.3; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-bottom: 22px; }

/* 비교 매트릭스 */
.matrix { width: 100%; max-width: 760px; border: 1px solid var(--border-card); border-radius: 14px; overflow: hidden; font-size: 14.5px; }
.mrow { display: grid; grid-template-columns: 1fr 134px 134px; }
.rl { padding: 8px 20px; color: var(--text-secondary); display: flex; align-items: center; }
.cv { padding: 8px 20px; font-family: var(--font-main); font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: flex-end; }
.cv.hero { background: var(--accent-soft); }
.cv.na { color: var(--text-muted); }
.mrow.item + .mrow.item .rl, .mrow.item + .mrow.item .cv { border-top: 1px dashed var(--border-card); }

/* 컬럼 헤더 (방 이름) */
.mrow.head .rl { padding: 0; }
.ch { padding: 13px 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.ch.hero { background: var(--accent-gradient); color: #fff; }
.ch .rn { font-size: 19px; font-weight: 900; }
.ch .badge { font-size: 11.5px; font-weight: 800; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
.ch.hero .badge { background: #fff; color: var(--accent-start); }
.ch.alt .badge { background: var(--text-muted); color: #fff; }
.ico-check { width: 10px; height: 5.5px; border-left: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: rotate(-45deg); display: inline-block; margin-top: -3px; flex: 0 0 auto; }
.ico-pause { display: inline-flex; gap: 2.5px; align-items: center; flex: 0 0 auto; }
.ico-pause::before, .ico-pause::after { content: ''; width: 2.5px; height: 8px; background: currentColor; display: block; border-radius: 1px; }

/* 섹션 밴드 (Need / Opportunity) */
.msec { background: var(--bg-card); padding: 7px 20px; display: flex; align-items: baseline; gap: 10px; border-top: 1px solid var(--border-card); }
.msec .st { font-size: 13.5px; font-weight: 800; }
.msec .sh { font-size: 12px; color: var(--text-secondary); }

/* 소계 / 최종 */
.mrow.sub .rl { font-weight: 800; color: var(--text-primary); border-top: 1px solid var(--border-card); }
.mrow.sub .cv { font-weight: 800; border-top: 1px solid var(--border-card); }
.mrow.grand .rl { font-weight: 800; font-size: 15px; color: var(--text-primary); border-top: 2px solid var(--accent-start); }
.mrow.grand .cv { font-size: 25px; font-weight: 900; border-top: 2px solid var(--accent-start); }
.mrow.grand .cv.hero { color: var(--accent-start); }

.formula { margin-top: 18px; width: 100%; max-width: 760px; background: var(--accent-gradient); color: #fff; border-radius: 14px; padding: 13px 26px; display: flex; align-items: center; justify-content: center; gap: 16px; }
.formula .f { font-family: var(--font-main); font-size: 16px; font-weight: 800; }
.formula .sep { opacity: 0.5; font-size: 18px; }
.note { margin-top: 11px; font-size: 12.5px; color: var(--text-muted); text-align: center; }
.note b { color: var(--text-secondary); }

.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">결정의 이유</h1>
  <div class="deck-meta">왜 현관이 1순위인가?</div>
  <div class="matrix">
    <div class="mrow head">
      <div class="rl"></div>
      <div class="ch hero"><span class="rn">현관</span><span class="badge"><span class="ico-check"></span>1순위</span></div>
      <div class="ch alt"><span class="rn">거실</span><span class="badge"><span class="ico-pause"></span>미뤄짐</span></div>
    </div>

    <div class="msec"><span class="st">Need</span><span class="sh">얼마나 더러운가</span></div>
    <div class="mrow item"><div class="rl">기본 점수</div><div class="cv hero">+22</div><div class="cv">+20</div></div>
    <div class="mrow item"><div class="rl">비</div><div class="cv hero">+25</div><div class="cv">+5</div></div>
    <div class="mrow item"><div class="rl">사용자 귀가</div><div class="cv hero">+15</div><div class="cv">+5</div></div>
    <div class="mrow item"><div class="rl">취침 2h 이내</div><div class="cv hero na">·</div><div class="cv">+5</div></div>
    <div class="mrow sub"><div class="rl">소계</div><div class="cv hero">62</div><div class="cv">35</div></div>

    <div class="msec"><span class="st">Opportunity</span><span class="sh">지금 청소해도 되나</span></div>
    <div class="mrow item"><div class="rl">사용자가 거실에 머무름</div><div class="cv hero">0</div><div class="cv">−20</div></div>

    <div class="mrow grand"><div class="rl">최종</div><div class="cv hero">62</div><div class="cv">15</div></div>
  </div>
  <div class="formula">
    <span class="f">최종 = Need (오염 누적)</span>
    <span class="sep">＋</span>
    <span class="f">Opportunity (타이밍)</span>
  </div>
  <div class="note">점수는 <b>정해진 규칙으로 계산</b>. 같은 입력, 같은 결과.</div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="16-live-demo.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">17 / 27</a></div>
    <div class="nav-right"><a href="18-pipeline.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('18-pipeline.html');
  if (e.key === 'ArrowLeft') navigateTo('16-live-demo.html');
});
</script>
</body>
</html>
