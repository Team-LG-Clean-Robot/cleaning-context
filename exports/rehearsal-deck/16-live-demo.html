<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>라이브 데모</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0); --shadow-accent: oklch(0.12 0 0 / 0.12);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 18px 36px; display: flex; flex-direction: column; align-items: center; }
.title-row { display: flex; align-items: center; justify-content: center; gap: 11px; }
.title { font-size: 36px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; line-height: 1.3; }
.ico-live { width: 17px; height: 17px; border-radius: 50%; background: #d11; flex: 0 0 auto; box-shadow: 0 0 0 0 rgba(221,17,17,0.5); animation: pulse 2s infinite; }
.deck-meta { font-size: 13px; color: var(--text-secondary); text-align:center; margin-top: 4px; margin-bottom: 16px; }

.stage { display: flex; gap: 20px; width: 100%; max-width: 1208px; align-items: stretch; margin-top: 14px; }
.embed-col { flex: 1.55; display: flex; flex-direction: column; gap: 8px; }
.embed-bar { display: flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 9px; background: var(--bg-card); border: 1px solid var(--border-card); font-size: 12.5px; color: var(--text-secondary); font-family: var(--font-main); }
.embed-dot { width: 9px; height: 9px; border-radius: 50%; background: #d11; flex-shrink: 0; box-shadow: 0 0 0 0 rgba(221,17,17,0.5); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(221,17,17,0.5);} 70% { box-shadow: 0 0 0 7px rgba(221,17,17,0);} 100% { box-shadow: 0 0 0 0 rgba(221,17,17,0);} }
.embed-open { margin-left: auto; color: var(--accent-start); text-decoration: none; font-weight: 700; }
.embed-frame { width: 100%; height: 76vh; max-height: 900px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-card); background: var(--surface-raised); box-shadow: 0 8px 32px var(--shadow-accent); }
.embed-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

.steps-col { flex: 1; display: flex; flex-direction: column; }
.steps-head { font-size: 13px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.04em; margin-bottom: 10px; }
.step { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--border-card); }
.step:last-of-type { border-bottom: none; }
.step .no { flex: 0 0 28px; height: 28px; border-radius: 8px; background: var(--accent-gradient); color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.step .txt .h { font-size: 15px; font-weight: 800; }
.step .txt .m { font-size: 12.5px; color: var(--text-sub); margin-top: 2px; line-height: 1.45; }
.step .txt .m b { color: var(--accent-start); }

.backup { margin-top: 14px; width: 100%; max-width: 1140px; font-size: 12px; color: var(--text-muted); text-align: center; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 9px; padding: 8px 16px; }
.backup b { color: var(--accent-start); }

.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <div class="title-row"><span class="ico-live"></span><h1 class="title">라이브 데모</h1></div>
  <div class="stage">
    <div class="embed-col">
      <div class="embed-bar">
        <span class="embed-dot"></span>
        <span>robot-cleaner.askewly.com</span>
        <a class="embed-open" href="https://robot-cleaner.askewly.com/" target="_blank" rel="noopener">새 탭 ↗</a>
      </div>
      <div class="embed-frame">
        <iframe src="https://robot-cleaner.askewly.com/" title="라이브 데모" loading="lazy"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
      </div>
    </div>
  </div>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="15-design.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">16 / 27</a></div>
    <div class="nav-right"><a href="17-scoring-axes.html" onclick="event.preventDefault(); navigateTo(this.href)">다음 →</a></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') navigateTo('17-scoring-axes.html');
  if (e.key === 'ArrowLeft') navigateTo('15-design.html');
});
</script>
</body>
</html>
