<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Q&A</title>
<link href="assets/fonts/pretendard.css" rel="stylesheet">
<style>
:root {
  --bg-primary: oklch(0.99 0 0); --bg-card: oklch(0.97 0 0); --surface-raised: #ffffff; --border-card: oklch(0.85 0 0);
  --text-primary: oklch(0.12 0 0); --text-secondary: oklch(0.55 0 0); --text-muted: oklch(0.70 0 0); --text-sub: oklch(0.30 0 0);
  --accent-start: oklch(0.12 0 0); --accent-end: oklch(0.42 0 0); --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end)); --accent-soft: oklch(0.95 0 0); --accent-border: oklch(0.80 0 0);
  --nav-bg: oklch(0.99 0 0 / 0.95); --nav-border: oklch(0.85 0 0); --nav-accent: oklch(0.12 0 0); --nav-hover: oklch(0.42 0 0); --nav-disabled: oklch(0.80 0 0);
  --font-main: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-primary); font-family: var(--font-main); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding-bottom: 50px; }
.container { width: 1280px; padding: 44px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 0.2em; color: var(--text-secondary); margin-bottom: 22px; }
.eyebrow .lg { color: var(--text-primary); }
.title { font-size: 92px; font-weight: 900; letter-spacing: -0.01em; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.rule { width: 300px; height: 4px; background: linear-gradient(to right, transparent 0%, var(--accent-start) 50%, transparent 100%); margin: 26px 0; }
.thanks { font-size: 24px; font-weight: 700; color: var(--text-sub); margin-bottom: 30px; }
.tagline { font-size: 21px; font-weight: 600; color: var(--text-sub); margin-top: 28px; }
.tagline b { font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.qr-card { display: inline-flex; flex-direction: column; align-items: center; gap: 12px; background: var(--surface-raised); border: 1px solid var(--border-card); border-radius: 16px; padding: 22px 22px 18px; text-decoration: none; box-shadow: 0 8px 32px oklch(0.12 0 0 / 0.08); }
.qr-card .qr { width: 184px; height: 184px; display: block; }
.qr-cap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.qr-label { font-size: 14px; font-weight: 700; color: var(--text-sub); }
.qr-url { font-size: 14px; font-weight: 800; color: var(--accent-start); font-family: var(--font-main); }
.slide-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--nav-border); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.slide-nav-inner { width: 1280px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; }
.slide-nav a { text-decoration: none; font-size: 14px; font-weight: 700; color: var(--nav-accent); transition: color 0.2s; }
.slide-nav a:hover { color: var(--nav-hover); }
.slide-nav .nav-disabled { font-size: 14px; font-weight: 700; color: var(--nav-disabled); cursor: default; }
.slide-nav .nav-center a { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
body { opacity: 0; animation: fadeIn 0.4s ease forwards; } body.fade-out { animation: fadeOut 0.3s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">팀 럭키 금성</div>
  <h1 class="title">Q &amp; A</h1>
  <span class="rule" role="presentation"></span>
  <p class="thanks">끝까지 들어주셔서 감사합니다</p>
  <a class="qr-card" href="https://robot-cleaner.askewly.com/" target="_blank" rel="noopener">
    <img class="qr" src="qr-demo.png" alt="라이브 데모 QR 코드">
    <div class="qr-cap">
      <span class="qr-label">휴대폰으로 스캔 · 라이브 데모</span>
      <span class="qr-url">robot-cleaner.askewly.com</span>
    </div>
  </a>
  <p class="tagline"><b>Lumos</b>, 맥락을 읽는 로봇청소기</p>
</div>

<nav class="slide-nav">
  <div class="slide-nav-inner">
    <div class="nav-left"><a href="26-team.html" onclick="event.preventDefault(); navigateTo(this.href)">← 이전</a></div>
    <div class="nav-center"><a href="index.html">27 / 27</a></div>
    <div class="nav-right"><span class="nav-disabled">다음 →</span></div>
  </div>
</nav>
<script>
function navigateTo(url) { document.body.classList.add('fade-out'); setTimeout(function() { window.location.href = url; }, 300); }
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') navigateTo('26-team.html');
});
</script>
</body>
</html>
